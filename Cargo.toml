[package]
name = "lilvault"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[dependencies]
axum = "0.8"
rmcp = { version = "3.9", default-features = false, features = ["server", "macros", "transport-streamable-http-server"] }
rustix = { version = "1", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
rmcp = { version = "3.9", default-features = false, features = ["client", "transport-streamable-http-client-reqwest"] }
reqwest = { version = "0.13", default-features = false, features = ["json"] }
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
