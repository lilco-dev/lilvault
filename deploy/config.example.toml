# Optional reference for a custom configuration; the stack generates this file.
# Install as <stack-root>/config/gateway.generated.toml only if you replace the
# initializer's output deliberately. Agent keys live in /agents, added with lilvault-add-agent.
[server]
# Listen inside the container; Compose publishes only on the host's loopback.
listen = "0.0.0.0:8737"
# Add the exact approved private HTTPS authority before remote use.
mcp_allowed_hosts = ["localhost", "127.0.0.1", "::1"]

[[vaults]]
id = "agents"
path = "/data/vaults/agents"
enabled = true

[auth]
# One key file per agent: <name>.token (read-write) or <name>.ro.token (read-only).
# Add them with: docker exec -it <gateway> lilvault-add-agent <name>
keys_dir = "/agents"
