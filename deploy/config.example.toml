# Optional reference for the configuration generated by lilvault-init.
[server]
listen = "0.0.0.0:8737"
# Add the exact approved private HTTPS authority before remote use.
mcp_allowed_hosts = ["localhost", "127.0.0.1", "::1"]

# lilvault-add-vault writes markers here; the gateway hot-discovers each
# marker as <root>/<vault-id> without a restart or configuration edit.
[vault_registry]
dir = "/registry"
root = "/data/vaults"

[auth]
# Each <name>.token has a matching <name>.permissions file containing explicit
# vault:read or vault:read-write lines. Manage both with lilvault-add-agent.
keys_dir = "/agents"
