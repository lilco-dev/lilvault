# Copy to config.toml (ignored by Git) and set an existing disposable vault path.
[server]
listen = "127.0.0.1:8737"
# MCP Host validation defaults to loopback. Add only an approved proxy authority.
# mcp_allowed_hosts = ["localhost", "127.0.0.1", "::1", "approved.example:443"]

[[vaults]]
id = "test"
path = "/absolute/path/to/disposable/vault"
enabled = true

# Agent credentials: either a key directory (like ssh authorized_keys, and what the
# container stack uses) or explicit entries with tokens from the environment.
# Key files are named <agent>.token (read-write) or <agent>.ro.token (read-only) and
# each holds one 64-hex-character token; permissions cover all enabled vaults.
[auth]
keys_dir = "/absolute/path/to/agent-keys"

